name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is claimed in the pyproject classifiers -- test the claim.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all,dev]"
      # Cache the embedding model so most runs skip the HuggingFace download
      # entirely. The default BGE-small model lands in the HF hub cache (and
      # fastembed's own cache, depending on version); cache both.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: embed-model-${{ runner.os }}-bge-small-en-v1.5
      # Pre-download the model in an isolated, retrying step so a transient HF
      # hub failure retries here (and fails fast with a clear error) instead of
      # cascading into ~60 minutes of test timeouts (#376). On a cache hit this
      # is instant; on a cache miss the retries absorb transient CDN blips.
      - name: Warm up embedding model (retry transient HF hub failures)
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          for attempt in 1 2 3 4 5; do
            python -c "from vstash.embed import warmup; warmup('BAAI/bge-small-en-v1.5')" && exit 0
            echo "::warning::embedding model warm-up attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::embedding model download failed after 5 attempts (HF hub flake)"
          exit 1
      # tree-sitter-language-pack >= 1.x no longer ships grammars in the wheel:
      # get_parser() downloads them on first use from the project's GitHub
      # releases. A 504 there raises DownloadError, code_split silently falls
      # back to regex, and test_code_split fails on every Python version -- for
      # a reason that has nothing to do with the change under test. Cache the
      # versioned parser dir and fetch every grammar vstash maps in an isolated,
      # retrying step, mirroring the embedding-model warm-up above.
      - name: Locate tree-sitter parser cache
        id: tslp
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import importlib.metadata as m
          import os
          import tree_sitter_language_pack as t
          print(f"version={m.version('tree-sitter-language-pack')}")
          d = t.cache_dir() if hasattr(t, "cache_dir") else ""
          print(f"dir={os.path.dirname(d) if d else ''}")
          EOF
      - name: Cache tree-sitter parsers
        if: steps.tslp.outputs.dir != ''
        uses: actions/cache@v6
        with:
          path: ${{ steps.tslp.outputs.dir }}
          key: tslp-${{ runner.os }}-${{ steps.tslp.outputs.version }}
      - name: Download tree-sitter parsers (retry transient GitHub failures)
        if: steps.tslp.outputs.dir != ''
        run: |
          for attempt in 1 2 3 4 5; do
            python - <<'EOF' && exit 0
          import tree_sitter_language_pack as t
          from vstash.code_split import _TS_LANG_MAP
          langs = sorted(set(_TS_LANG_MAP.values()))
          # The pack's manifest names differ for a few entries (e.g. 'csharp'
          # vs vstash's 'c_sharp', which has no definition node types and so
          # never takes the AST path anyway). download() rejects the whole
          # list on one unknown name, so fetch only the ones it knows.
          known = set(t.manifest_languages())
          langs = [lang for lang in langs if lang in known]
          t.download(langs)
          for lang in langs:
              t.get_parser(lang)
          print(f"tree-sitter parsers ready: {len(langs)} languages")
          EOF
            echo "::warning::tree-sitter parser download attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::tree-sitter parser download failed after 5 attempts (GitHub releases flake)"
          exit 1
      - name: Run tests with coverage
        # tree-sitter-language-pack bundles every grammar in a single native lib
        # (_native.abi3.so). On the 3.10/3.11 runners that lib intermittently
        # fails to load under the full-suite memory pressure, flipping
        # _HAS_TREE_SITTER off for the whole process; code-split then falls back
        # to regex and TestExtendedLanguages (C/C++/Ruby/PHP) sees 1 block
        # instead of >=2. The fault is per-process and load-dependent, so a fresh
        # pytest process re-running just the handful of failed tests (a tiny
        # memory footprint) loads the lib cleanly and passes. Retry the
        # last-failed set in fresh processes; pass --no-cov on retries so the
        # first run's coverage.xml is preserved for the 3.12 Codecov upload. A
        # genuine failure fails every retry. See memory: ci-treesitter-grammar-flake.
        run: |
          pytest --tb=short -q --cov=vstash --cov-report=xml --cov-report=term && exit 0
          for attempt in 1 2 3; do
            echo "::warning::pytest failed; retry ${attempt} re-running last-failed tests in a fresh process (per-process tree-sitter native-lib load flake on 3.10/3.11)."
            pytest --tb=short -q --lf --no-cov && exit 0
          done
          exit 1
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
