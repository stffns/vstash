version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - "dependencies"
      - "python"
    groups:
      # Group runtime dep bumps so we get one PR per week per ecosystem
      # bucket, not 14. Major bumps still come as their own PRs because
      # they can break us.
      runtime-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "torch*"
          - "sentence-transformers"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
      include: scope
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
