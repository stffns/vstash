[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vstash"
dynamic = ["version"]
description = "Local document memory with instant semantic search. Drop any file. Ask anything. Get an answer in under a second."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["embeddings", "semantic-search", "rag", "local", "cerebras", "sqlite-vec", "fastembed", "vector-stash"]

dependencies = [
    "pydantic>=2.0.0,<3",
    "fastembed>=0.4.0,<1",
    "sqlite-vec>=0.1.6",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
vstash = "vstash.cli:app"
vstash-mcp = "vstash.mcp:main"

[project.optional-dependencies]
cerebras = ["cerebras-cloud-sdk>=1.0.0,<2"]
ollama = ["ollama>=0.3.0,<1"]
openai = ["openai>=1.0.0,<3"]
mcp = ["mcp>=1.0.0,<2"]
ingest = ["markitdown>=0.1.0"]
langchain = ["langchain-core>=0.2.0,<1"]
watch = ["watchdog>=4.0.0"]
all = [
    "vstash[cerebras]",
    "vstash[ollama]",
    "vstash[openai]",
    "vstash[mcp]",
    "vstash[ingest]",
    "vstash[langchain]",
    "vstash[watch]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "pre-commit",
    "ruff",
]

[tool.hatch.version]
path = "vstash/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
